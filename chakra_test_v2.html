<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>脉轮能量测评</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1c1a18;
  --ink-2: #4a4642;
  --ink-3: #8c8680;
  --surface: #faf8f4;
  --surface-2: #f2efe9;
  --surface-3: #e8e4dc;
  --line: #ddd8cf;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--surface);
  color: var(--ink);
  min-height: 100vh;
  font-size: 15px;
  line-height: 1.7;
}

/* ── COVER ── */
#cover {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 3rem 1.5rem;
  text-align: center;
  position: relative;
  overflow: hidden;
}
#cover::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse 80% 60% at 50% 40%, #f0ebe0 0%, var(--surface) 70%);
  z-index: 0;
}
.cover-inner { position: relative; z-index: 1; max-width: 520px; }
.cover-eyebrow {
  font-family: 'Noto Serif SC', serif;
  font-size: 11px;
  letter-spacing: .25em;
  color: var(--ink-3);
  margin-bottom: 2rem;
  text-transform: uppercase;
}
.cover-title {
  font-family: 'Noto Serif SC', serif;
  font-size: clamp(2.2rem, 6vw, 3.2rem);
  font-weight: 300;
  line-height: 1.25;
  margin-bottom: 1.5rem;
  color: var(--ink);
  letter-spacing: .02em;
}
.cover-sub {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.8;
  margin-bottom: 2.5rem;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}
.chakra-dots {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-bottom: 3rem;
}
.chakra-dots span {
  width: 10px; height: 10px;
  border-radius: 50%;
  opacity: .75;
}
.btn-start {
  display: inline-block;
  padding: 14px 44px;
  background: var(--ink);
  color: var(--surface);
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 14px;
  font-weight: 500;
  letter-spacing: .08em;
  border: none;
  cursor: pointer;
  border-radius: 2px;
  transition: opacity .2s;
}
.btn-start:hover { opacity: .8; }
.cover-note {
  margin-top: 1.5rem;
  font-size: 12px;
  color: var(--ink-3);
}

/* ── QUIZ ── */
#quiz { display: none; max-width: 680px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

.progress-wrap { margin-bottom: 2.5rem; }
.progress-meta {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: .6rem;
}
.progress-chakra {
  font-family: 'Noto Serif SC', serif;
  font-size: 18px;
  font-weight: 400;
  color: var(--ink);
}
.progress-count { font-size: 12px; color: var(--ink-3); }
.progress-track {
  height: 2px;
  background: var(--line);
  border-radius: 1px;
  overflow: hidden;
}
.progress-fill {
  height: 2px;
  border-radius: 1px;
  transition: width .4s ease;
}
.chakra-eng {
  font-size: 11px;
  letter-spacing: .15em;
  color: var(--ink-3);
  margin-top: .25rem;
  text-transform: uppercase;
}

.q-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1.4rem 1.6rem;
  margin-bottom: .75rem;
  transition: border-color .15s;
}
.q-card.answered { border-color: var(--surface-3); }
.q-text {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.7;
  margin-bottom: 1rem;
}
.q-scale {
  display: flex;
  align-items: center;
  gap: 0;
}
.scale-label {
  font-size: 10px;
  color: var(--ink-3);
  white-space: nowrap;
  flex-shrink: 0;
  width: 52px;
  line-height: 1.3;
}
.scale-label.r { text-align: right; }
.scale-btns {
  display: flex;
  flex: 1;
  justify-content: center;
  gap: 6px;
}
.sb {
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: transparent;
  cursor: pointer;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-3);
  transition: all .12s;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Sans SC', sans-serif;
}
.sb:hover { border-color: var(--ink-3); color: var(--ink); background: var(--surface-2); }
.sb.on { color: #fff; border-color: transparent; }

.nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 2rem;
}
.nav-info { font-size: 12px; color: var(--ink-3); }
.nav-info b { color: var(--ink); font-weight: 500; }
.nav-btns { display: flex; gap: 10px; }
.btn {
  padding: 10px 26px;
  border: 1px solid var(--line);
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  border-radius: 2px;
  transition: all .15s;
  font-family: 'Noto Sans SC', sans-serif;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .3; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: transparent; }
.btn.primary:hover { opacity: .85; }
.btn.ghost { border-color: transparent; color: var(--ink-3); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-2); }

/* ── RESULT ── */
#result { display: none; max-width: 680px; margin: 0 auto; padding: 2rem 1.5rem 5rem; }

.result-header { text-align: center; padding: 2rem 0 2.5rem; }
.result-title {
  font-family: 'Noto Serif SC', serif;
  font-size: 26px;
  font-weight: 300;
  margin-bottom: .4rem;
}
.result-sub { font-size: 13px; color: var(--ink-3); }

.chakra-result {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 1.25rem 1.5rem;
  margin-bottom: .75rem;
}
.cr-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: .85rem;
}
.cr-name {
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  font-weight: 400;
}
.cr-state {
  font-size: 12px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 2px;
}
.state-low { background: #EBF5FB; color: #1A5276; }
.state-ok { background: #EAFAF1; color: #1E6832; }
.state-high { background: #FDEDEC; color: #922B21; }

/* Bipolar bar */
.bipolar-wrap { position: relative; }
.bipolar-track {
  height: 8px;
  background: var(--surface-2);
  border-radius: 4px;
  position: relative;
  overflow: hidden;
}
.bipolar-center {
  position: absolute;
  left: 50%;
  top: 0;
  width: 1px;
  height: 100%;
  background: var(--line);
  z-index: 2;
}
.bipolar-fill {
  position: absolute;
  top: 0;
  height: 100%;
  border-radius: 4px;
  transition: width 1.2s cubic-bezier(.4,0,.2,1), left 1.2s cubic-bezier(.4,0,.2,1);
}
.bipolar-labels {
  display: flex;
  justify-content: space-between;
  margin-top: .35rem;
}
.bipolar-label { font-size: 10px; color: var(--ink-3); }
.bipolar-score {
  text-align: center;
  font-size: 12px;
  color: var(--ink-2);
  margin-top: .2rem;
}

.cr-desc {
  margin-top: .85rem;
  padding-top: .85rem;
  border-top: 1px solid var(--surface-2);
  font-size: 13px;
  color: var(--ink-2);
  line-height: 1.7;
}

.result-actions {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-top: 2.5rem;
}

/* summary overview */
.overview-card {
  background: var(--surface-2);
  border-radius: 4px;
  padding: 1.5rem;
  margin-bottom: 1.5rem;
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  text-align: center;
}
.ov-item {}
.ov-dot {
  width: 32px; height: 32px;
  border-radius: 50%;
  margin: 0 auto .4rem;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.ov-name { font-size: 10px; color: var(--ink-3); margin-bottom: .2rem; line-height: 1.2; }
.ov-score { font-size: 11px; font-weight: 500; }

@media (max-width: 520px) {
  .scale-btns { gap: 4px; }
  .sb { width: 30px; height: 30px; font-size: 11px; }
  .scale-label { width: 42px; font-size: 9px; }
  .overview-card { grid-template-columns: repeat(4, 1fr); }
}
</style>
</head>
<body>

<!-- COVER -->
<div id="cover">
  <div class="cover-inner">
    <div class="cover-eyebrow">能量中心评估</div>
    <h1 class="cover-title">脉轮<br>能量测评</h1>
    <p class="cover-sub">56 道题目，测量你七个脉轮的活跃状态。<br>每个脉轮将呈现「不足」「平衡」「过度」三种结果，<br>帮助你看清能量流动的真实状况。</p>
    <div class="chakra-dots">
      <span style="background:#C0392B"></span>
      <span style="background:#D35400"></span>
      <span style="background:#B7950B"></span>
      <span style="background:#1E8449"></span>
      <span style="background:#1A6FA8"></span>
      <span style="background:#5B2C6F"></span>
      <span style="background:#7D3C98"></span>
    </div>
    <button class="btn-start" onclick="startTest()">开始测评</button>
    <p class="cover-note">约需 10 分钟 · 请依照当下真实感受作答</p>
  </div>
</div>

<!-- QUIZ -->
<div id="quiz"></div>

<!-- RESULT -->
<div id="result"></div>

<script>
var CH = [

var QQ = [

function startTest() {
  document.getElementById('cover').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuiz();
  window.scrollTo(0,0);
}

function renderQuiz() {
  var ci = S.step, c = CH[ci], qs = QQ[ci], as = S.ans[ci];
  var filled = as.filter(function(a){ return a !== null; }).length;
  var total_q = QQ.reduce(function(t,q){ return t+q.length; }, 0);
  var done_q = S.ans.slice(0, ci).reduce(function(t,a){ return t+a.filter(function(x){ return x!==null; }).length; }, 0) + filled;
  var pct_global = Math.round(done_q / total_q * 100);
  var done = as.every(function(a){ return a !== null; });

  var qhtml = qs.map(function(item, qi) {
    var val = as[qi];
    var rbs = [0,1,2,3,4,5].map(function(v) {
      return '<button class="sb'+(val===v?' on':'')+'"'+(val===v?' style="background:'+c.col+'"':'')+
             ' onclick="pick('+qi+','+v+')" title="'+v+'">'+v+'</button>';
    }).join('');
    return '<div class="q-card'+(val!==null?' answered':'')+'">'+
           '<div class="q-text">'+(qi+1)+'. '+item[0]+'</div>'+
           '<div class="q-scale">'+
           '<div class="scale-label">完全<br>没有</div>'+
           '<div class="scale-btns">'+rbs+'</div>'+
           '<div class="scale-label r">感觉<br>强烈</div>'+
           '</div></div>';
  }).join('');

  var prevBtn = ci > 0 ? '<button class="btn ghost" onclick="prevStep()">← 上一组</button>' : '';
  var nextLabel = ci === 6 ? '查看结果 →' : '下一组 →';
  var nextClass = ci === 6 ? 'btn primary' : 'btn';

  document.getElementById('quiz').innerHTML =
    '<div class="progress-wrap">'+
    '<div class="progress-meta">'+
    '<div><div class="progress-chakra">'+c.sym+' '+c.name+'</div>'+
    '<div class="chakra-eng">'+c.eng+'</div></div>'+
    '<div class="progress-count">第 '+(ci+1)+' / 7 组 &nbsp;·&nbsp; 总进度 '+pct_global+'%</div>'+
    '</div>'+
    '<div class="progress-track"><div class="progress-fill" style="width:'+pct_global+'%;background:'+c.col+'"></div></div>'+
    '</div>'+
    qhtml+
    '<div class="nav">'+
    '<div class="nav-info">本组已作答 <b>'+filled+'</b> / '+qs.length+' 题</div>'+
    '<div class="nav-btns">'+prevBtn+
    '<button class="'+nextClass+'" '+(done?'':'disabled')+' onclick="nextStep()">'+nextLabel+'</button>'+
    '</div></div>';
}

function pick(qi, val) {
  S.ans[S.step][qi] = val;
  renderQuiz();
}

function nextStep() {
  if (S.step < 6) { S.step++; renderQuiz(); window.scrollTo(0,0); }
  else showResult();
}

function prevStep() {
  if (S.step > 0) { S.step--; renderQuiz(); window.scrollTo(0,0); }
}

function calcScore(ci) {
  var qs = QQ[ci], as = S.ans[ci];
  var lowSum = 0, highSum = 0, lowMax = 0, highMax = 0;
  qs.forEach(function(q, i) {
    if (q[1] === 0) { lowSum += as[i]; lowMax += 5; }
    else { highSum += as[i]; highMax += 5; }
  });
  // net score: positive = over-active, negative = under-active
  // normalize: (highSum/highMax - lowSum/lowMax) * 100
  var score = ((highSum / highMax) - (lowSum / lowMax)) * 100;
  return Math.round(score);
}

function getState(score) {
  if (score <= -20) return 'low';
  if (score >= 20) return 'high';
  return 'ok';
}

function stateLabel(state) {
  if (state === 'low') return ['不足', 'state-low'];
  if (state === 'high') return ['过度活跃', 'state-high'];
  return ['平衡', 'state-ok'];
}

function showResult() {
  document.getElementById('quiz').style.display = 'none';
  document.getElementById('result').style.display = 'block';
  window.scrollTo(0,0);

  var scores = CH.map(function(_,i){ return calcScore(i); });

  // Overview row
  var ovHtml = scores.map(function(sc, i) {
    var c = CH[i], st = getState(sc);
    var dotBg = st === 'ok' ? c.col : (st === 'low' ? c.col+'33' : c.col);
    var dotBorder = st === 'low' ? '2px solid '+c.col : 'none';
    var scoreColor = st === 'low' ? '#1A5276' : (st === 'high' ? '#922B21' : '#1E6832');
    return '<div class="ov-item">'+
      '<div class="ov-dot" style="background:'+dotBg+';border:'+dotBorder+'">'+c.sym+'</div>'+
      '<div class="ov-name">'+c.name+'</div>'+
      '<div class="ov-score" style="color:'+scoreColor+'">'+(sc>0?'+':'')+sc+'%</div>'+
      '</div>';
  }).join('');

  // Detailed rows
  var detailHtml = scores.map(function(sc, i) {
    var c = CH[i], st = getState(sc), sl = stateLabel(st);
    var pctAbs = Math.abs(sc);
    var isNeg = sc < 0;
    // bar: center at 50%, extends left (low) or right (high)
    var barLeft = isNeg ? (50 - pctAbs/2)+'%' : '50%';
    var barWidth = (pctAbs/2)+'%';
    var barColor = isNeg ? '#1A5276' : c.col;
    var desc = st === 'low' ? c.low : (st === 'high' ? c.high : c.ok);

    return '<div class="chakra-result">'+
      '<div class="cr-top">'+
      '<span class="cr-name">'+c.sym+' '+c.name+'</span>'+
      '<span class="cr-state '+sl[1]+'">'+sl[0]+'</span>'+
      '</div>'+
      '<div class="bipolar-wrap">'+
      '<div class="bipolar-track">'+
      '<div class="bipolar-center"></div>'+
      '<div class="bipolar-fill" style="left:'+barLeft+';width:0%;background:'+barColor+'" data-w="'+barWidth+'"></div>'+
      '</div>'+
      '<div class="bipolar-labels"><span class="bipolar-label">← 不足</span><span class="bipolar-label">过度 →</span></div>'+
      '<div class="bipolar-score">'+(sc>0?'+':'')+sc+'%</div>'+
      '</div>'+
      '<div class="cr-desc">'+desc+'</div>'+
      '</div>';
  }).join('');

  document.getElementById('result').innerHTML =
    '<div class="result-header">'+
    '<div class="result-title">你的脉轮能量报告</div>'+
    '<div class="result-sub">±20% 以内为平衡区间 · 负值偏不足 · 正值偏过度</div>'+
    '</div>'+
    '<div class="overview-card">'+ovHtml+'</div>'+
    detailHtml+
    '<div class="result-actions">'+
    '<button class="btn ghost" onclick="restart()">重新测评</button>'+
    '</div>';

  setTimeout(function() {
    document.querySelectorAll('.bipolar-fill[data-w]').forEach(function(el) {
      el.style.width = el.dataset.w;
    });
  }, 80);
}

function restart() {
  S.step = 0;
  S.ans = QQ.map(function(q){ return new Array(q.length).fill(null); });
  document.getElementById('result').style.display = 'none';
  document.getElementById('cover').style.display = 'flex';
  window.scrollTo(0,0);
}
</script>
</body>
</html>
