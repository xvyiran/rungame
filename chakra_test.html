  var done=a.every(function(x){return x!==null;});
  var vn=S.ver==='psych'?'自我心理探索':'身体觉察';
  var qh=q.map(function(item,qi){
    var val=a[qi];
    var rbs=[1,2,3,4,5].map(function(v){
      return '<button class="rb'+(val===v?' on':'')+'"'+(val===v?' style="background:'+c.col+'"':'')+' data-qi="'+qi+'" data-v="'+v+'">'+v+'</button>';
    }).join('');
    return '<div class="qb'+(val!==null?' ok':'')+'"><div class="qt">'+item[0]+'</div><div class="rr"><div class="rl">完全不符合</div><div class="rbw">'+rbs+'</div><div class="rl r">完全符合</div></div></div>';
  }).join('');
  return '<div class="pg"><div class="pf" style="width:'+pct+'%;background:'+c.col+'"></div></div><div class="ch"><div class="ci" style="background:'+c.bg+';color:'+c.col+'">'+c.sym+'</div><div class="cn">'+c.name+'</div><div class="cs">'+c.eng+' · '+c.pos+'</div></div><div style="text-align:center"><span class="vb">'+vn+'</span></div>'+qh+'<div class="nv"><div class="ni">第 <b>'+(S.step+1)+'</b> / 7 个脉轮</div><div class="nbtns">'+(S.step>0?'<button class="btn g" id="bp">← 上一个</button>':'')+'<button class="btn'+(S.step===6?' p':'')+'" id="bn"'+(done?'':' disabled')+'>'+(S.step===6?'查看结果 →':'下一个 →')+'</button></div></div>';
}

function rHTML(){
  var scores=CH.map(function(_,i){return getScore(i);});
  var avg=scores.reduce(function(s,v){return s+v;},0)/7;
  var minI=0,maxI=0;
  scores.forEach(function(s,i){if(s<scores[minI])minI=i;if(s>scores[maxI])maxI=i;});
  var vn=S.ver==='psych'?'自我心理探索版':'身体觉察版';
  var rows=CH.map(function(c,i){
    var s=scores[i],sv=st(s),pct=Math.round(s/5*100);
    return '<div class="crow"><div class="cdot" style="background:'+c.bg+';color:'+c.col+'">'+c.sym+'</div><div class="cbd"><div class="ctop"><span class="cname">'+c.name+'</span><span class="cst" style="color:'+sv[1]+'">'+sv[0]+' · '+pct+'%</span></div><div class="cbg"><div class="cbar" data-p="'+pct+'" style="background:'+c.col+'"></div></div></div></div>';
  }).join('');
  return '<div class="rth"><div class="rt">你的脉轮报告</div><div class="rsub">综合平衡指数：'+Math.round(avg/5*100)+'%</div><div class="rv">'+vn+'</div></div>'+rows+'<div class="sep"></div><div class="ig"><div class="icard"><div class="ilb">最需要关注</div><div class="iv" style="color:'+CH[minI].col+'">'+CH[minI].name+'</div><div class="ip">'+Math.round(scores[minI]/5*100)+'% · '+st(scores[minI])[0]+'</div></div><div class="icard"><div class="ilb">最活跃稳定</div><div class="iv" style="color:'+CH[maxI].col+'">'+CH[maxI].name+'</div><div class="ip">'+Math.round(scores[maxI]/5*100)+'% · '+st(scores[maxI])[0]+'</div></div></div><div class="tip"><h4>针对 '+CH[minI].name+' 的调理建议</h4><p>'+TP[S.ver][minI]+'</p></div><div class="rbr"><button class="btn g" id="bsw">换个版本测试</button><button class="btn" id="brs">重新测试</button></div>';
}

function bind(){
  var vp=document.getElementById('vp'),vb_=document.getElementById('vb_');
  if(vp)vp.onclick=function(){S.ver='psych';S.step=0;initAns();S.screen='quiz';render();};
  if(vb_)vb_.onclick=function(){S.ver='body';S.step=0;initAns();S.screen='quiz';render();};
  document.querySelectorAll('.rb[data-qi]').forEach(function(btn){
    btn.onclick=function(){S.ans[S.step][+btn.dataset.qi]=+btn.dataset.v;render(true);};
  });
  var bp=document.getElementById('bp'),bn=document.getElementById('bn');
  if(bp)bp.onclick=function(){S.step--;render();};
  if(bn)bn.onclick=function(){if(S.step<6){S.step++;render();}else{S.screen='result';render();}};
  var bsw=document.getElementById('bsw'),brs=document.getElementById('brs');
  if(bsw)bsw.onclick=function(){S.screen='start';S.ver=null;render();};
  if(brs)brs.onclick=function(){S.step=0;initAns();S.screen='quiz';render();};
}

render();
</script>
</body>
</html>
