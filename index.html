<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>能力训练营 · 游戏集合</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#58CC02;--green-dk:#3A9900;
  --orange:#FF9600;--orange-dk:#C96800;
  --purple:#7C5CBF;
  --bg:#FFFDF8;--bg2:#E8F4FD;
  --r:20px;
  /* phone shell dimensions */
  --pw:390px;--ph:760px;
}

/* ══════════════════════════════
   MOBILE  (< 768px)
   Full-screen, no shell visible
══════════════════════════════ */
body{
  font-family:-apple-system,'PingFang SC','Noto Sans SC',sans-serif;
  background:var(--bg2);
  min-height:100vh;
  display:flex;flex-direction:column;align-items:center;
}

/* ── header ── */
.topbar{
  width:100%;max-width:var(--pw);
  background:var(--bg);
  padding:14px 18px 12px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1.5px solid #EEE9DF;
  position:sticky;top:0;z-index:50;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.logo-wrap{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.logo-img{
  width:40px;height:40px;border-radius:50%;
  border:2.5px solid var(--green);overflow:hidden;
  flex-shrink:0;background:#D7F9EE;
  animation:bounce 2.4s ease-in-out infinite;
}
.logo-img img{width:40px;height:40px;object-fit:cover;}
@keyframes bounce{0%,100%{transform:translateY(0);}45%,55%{transform:translateY(-4px);}80%{transform:translateY(1px);}}
.logo-text{display:flex;flex-direction:column;gap:1px;min-width:0;}
.logo-title{font-size:16px;font-weight:900;color:#1A1A1A;white-space:nowrap;}
.logo-sub{font-size:10px;color:#AAA;font-weight:600;}
.pts-badge{
  display:flex;align-items:center;gap:4px;
  background:#FFF3D0;border:1.5px solid #FFD040;
  border-radius:20px;padding:5px 10px;flex-shrink:0;
}
.pts-num{font-size:13px;font-weight:900;color:#9A6800;}
.pts-lbl{font-size:9px;color:#C08800;font-weight:600;}

/* ── scroll body ── */
.scroll-body{
  width:100%;max-width:var(--pw);
  flex:1;overflow-y:auto;overflow-x:hidden;
  padding:14px 14px 90px;
  display:flex;flex-direction:column;gap:11px;
}

/* ── hero bubble ── */
.hero-bubble{
  background:#DDF4FF;border-radius:18px;
  padding:14px 16px;
  display:flex;align-items:center;gap:12px;
}
.bub-text{flex:1;}
.bub-main{font-size:15px;font-weight:900;color:#1A1A1A;line-height:1.4;}
.bub-sub{font-size:11px;color:#AAA;margin-top:3px;}
.streak-pill{
  display:flex;align-items:center;gap:5px;
  background:var(--orange);color:#fff;
  border-radius:20px;padding:6px 10px;
  font-size:12px;font-weight:900;
  box-shadow:0 3px 0 var(--orange-dk);flex-shrink:0;
}

/* ── section head ── */
.sec-head{display:flex;align-items:center;gap:8px;padding:4px 2px 0;}
.sec-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.sec-title{font-size:13px;font-weight:900;color:#2D2D2D;}

/* ── game card ── */
.game-card{
  background:var(--cbg);border:2px solid var(--cb);
  border-radius:var(--r);box-shadow:0 4px 0 var(--cs);
  padding:14px 14px 12px;cursor:pointer;
  transition:transform .12s,box-shadow .12s;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.game-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--cs);}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
.card-icon-wrap{
  width:60px;height:60px;border-radius:16px;
  background:rgba(255,255,255,.7);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;position:relative;overflow:hidden;
}
.char-img{width:60px;height:60px;object-fit:cover;border-radius:14px;}
.icon-badge{
  position:absolute;bottom:-2px;right:-2px;
  width:24px;height:24px;border-radius:8px;
  background:rgba(255,255,255,.92);border:1.5px solid rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.12);
}
.card-info{flex:1;min-width:0;}
.card-name{font-size:16px;font-weight:900;color:#1A1A1A;}
.card-desc{font-size:11px;color:#888;margin-top:3px;}
.card-tags{display:flex;gap:5px;margin-top:7px;}
.tag{font-size:9px;font-weight:700;background:rgba(0,0,0,.07);color:var(--ci);padding:3px 8px;border-radius:8px;}
.card-btn{
  background:var(--ci);color:#fff;
  font-size:12px;font-weight:900;
  padding:10px 0;border-radius:12px;text-align:center;
  box-shadow:0 3px 0 rgba(0,0,0,.15);
}

/* ── bottom nav ── */
.bottom-nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:var(--pw);
  background:#fff;border-top:1.5px solid #EEE9DF;
  display:flex;justify-content:space-around;
  padding:8px 0 max(16px,env(safe-area-inset-bottom));
  z-index:50;
}
.ni{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:700;color:#C8C4BC;
  min-width:64px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.ni.on{color:var(--green);}
.nb{width:40px;height:28px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
.ni.on .nb{background:#EDFAD0;}

/* ── game overlay (mobile full-screen) ── */
.game-overlay{
  position:fixed;inset:0;z-index:200;
  background:#000;
  display:none;flex-direction:column;
}
.game-overlay.open{display:flex;}
.game-topbar{
  background:#1C1C1C;
  padding:max(12px,env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:12px;flex-shrink:0;
}
.game-back{
  width:34px;height:34px;border-radius:50%;
  background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;
  font-size:16px;color:#fff;cursor:pointer;flex-shrink:0;
  -webkit-tap-highlight-color:transparent;
}
.game-name{font-size:15px;font-weight:800;color:#fff;flex:1;}
.game-iframe{
  flex:1;border:none;width:100%;height:100%;display:block;
  background:#fff;
}

/* ══════════════════════════════
   DESKTOP  (≥ 768px)
   Phone shell centred, dark bg
══════════════════════════════ */
@media(min-width:768px){
  body{
    background:#1A1A2E;
    min-height:100vh;
    flex-direction:row;
    align-items:stretch;
    justify-content:center;
  }

  /* ── Phone shell wrapper ── */
  .shell-wrap{
    width:var(--pw);
    flex-shrink:0;
    display:flex;flex-direction:column;
    /* iPhone-ish chrome */
    background:var(--bg);
    border-left:10px solid #2A2A3A;
    border-right:10px solid #2A2A3A;
    border-top:0;border-bottom:0;
    position:relative;
    /* clamp height to viewport */
    max-height:100vh;
    overflow:hidden;
  }
  /* top notch bar */
  .shell-wrap::before{
    content:'';
    position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:110px;height:28px;
    background:#2A2A3A;border-radius:0 0 18px 18px;
    z-index:60;pointer-events:none;
  }

  /* ── Right dark panel ── */
  .side-panel{
    flex:1;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:40px 48px;gap:24px;
  }
  .side-title{font-size:28px;font-weight:900;color:#fff;letter-spacing:-.5px;}
  .side-sub{font-size:14px;color:rgba(255,255,255,.4);font-weight:600;line-height:1.7;text-align:center;max-width:280px;}
  .side-hint{
    display:flex;align-items:center;gap:10px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    border-radius:14px;padding:12px 16px;
    font-size:12px;color:rgba(255,255,255,.5);font-weight:600;
    max-width:280px;text-align:left;line-height:1.6;
  }
  .side-hint-ico{font-size:20px;flex-shrink:0;}

  /* topbar: add top padding for notch */
  .topbar{padding-top:36px;}

  /* scroll body fills remaining space */
  .scroll-body{
    flex:1;overflow-y:auto;
    /* hide bottom nav overlap */
    padding-bottom:80px;
  }

  /* bottom nav stays at bottom of shell */
  .bottom-nav{
    position:sticky;bottom:0;
    left:auto;transform:none;
    max-width:100%;
  }

  /* No mobile overlay on desktop – use inline iframe instead */
  .game-overlay{display:none !important;}
  
  /* Desktop inline game view (replaces scroll-body content) */
  .desktop-game-view{
    flex:1;display:none;flex-direction:column;overflow:hidden;
  }
  .desktop-game-view.open{display:flex;}
  .desktop-game-topbar{
    background:#1C1C1C;padding:10px 14px;
    display:flex;align-items:center;gap:10px;flex-shrink:0;
  }
  .desktop-game-back{
    width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;
    font-size:14px;color:#fff;cursor:pointer;flex-shrink:0;
  }
  .desktop-game-name{font-size:13px;font-weight:800;color:#fff;flex:1;}
  .desktop-game-iframe{
    flex:1;border:none;width:100%;display:block;background:#fff;
  }
}

@media(max-width:767px){
  .shell-wrap{width:100%;}
  .side-panel{display:none;}
  .desktop-game-view{display:none !important;}
}
</style>
</head>

    <span>电脑端点击游戏卡片，在左侧手机框内预览游玩</span>
  </div>
</div>

<!-- ══ Mobile full-screen game overlay ══ -->
<div class="game-overlay" id="game-overlay">
  <div class="game-topbar">
    <div class="game-back" onclick="closeGame()">✕</div>
    <div class="game-name" id="mobile-game-name">游戏</div>
  </div>
  <iframe class="game-iframe" id="mobile-iframe" src="" allowfullscreen></iframe>
</div>

<script>
const isMobile = () => window.innerWidth < 768;

// Index of each card by game id (for tracking play count)
const playCounts = {};

function openGame(el) {
  const file = el.dataset.file;
  const name = el.dataset.name;
  const id = el.dataset.file.replace(/[^a-z]/g,'');

  playCounts[id] = (playCounts[id] || 0) + 1;

  if (isMobile()) {
    document.getElementById('mobile-game-name').textContent = name;
    document.getElementById('mobile-iframe').src = file;
    document.getElementById('game-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  } else {
    document.getElementById('desktop-game-name').textContent = name;
    document.getElementById('desktop-iframe').src = file;
    document.getElementById('scroll-body').style.display = 'none';
    document.getElementById('desktop-game-view').classList.add('open');
  }
}

function closeGame() {
  // Mobile
  document.getElementById('game-overlay').classList.remove('open');
  document.getElementById('mobile-iframe').src = '';
  document.body.style.overflow = '';
  // Desktop
  document.getElementById('desktop-game-view').classList.remove('open');
  document.getElementById('desktop-iframe').src = '';
  document.getElementById('scroll-body').style.display = '';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeGame();
});
</script>
</body>
</html>
